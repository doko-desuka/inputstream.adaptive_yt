name: Build Windows MSVC (Kodi Leia)

on:
  workflow_dispatch:

env:
  ADDON_ID: inputstream.adaptive_yt

jobs:
  build-windows:
    name: Windows MSVC Build
    runs-on: windows-latest

    steps:
      - name: Checkout Kodi repo (Leia)
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: Leia
          path: xbmc

      - name: Checkout addon repo
        uses: actions/checkout@v4
        with:
          path: ${{ env.ADDON_ID }}

      - name: Debug workspace tree
        run: |
          Write-Host "Workspace:"
          Get-ChildItem ${{ github.workspace }} -Depth 2

      - name: Create addon definition file
        run: |
          $defDir = "${{ github.workspace }}\xbmc\cmake\addons\addons"
          New-Item -ItemType Directory -Path $defDir -Force | Out-Null
          $file = Join-Path $defDir "${{ env.ADDON_ID }}.txt"
          "$env:ADDON_ID`n" | Out-File -FilePath $file -Encoding ascii
          Write-Host "Created addon definition: $file"

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake `
            -G "Visual Studio 17 2022" `
            -T v141 `
            -A x64 `
            -DENABLE_ADDONS=OFF `
            -DBUILD_BUNDLED_ADDONS=OFF `
            -DADDONS_TO_BUILD="${{ env.ADDON_ID }}" `
            -DADDON_SRC_PREFIX="${{ github.workspace }}\${{ env.ADDON_ID }}" `
            -DPACKAGE_ZIP=1 `
            -DPACKAGE_DIR="${{ github.workspace }}\build_zips" `
            "${{ github.workspace }}\xbmc\cmake\addons"

      - name: Build Addon
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ADDON_ID }}_windows_msvc.zip
          path: build_zips
